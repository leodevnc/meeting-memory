<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Memory</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header><div><span class="eyebrow">MEETING MEMORY</span><h1>대화를 실행 가능한 기록으로</h1><p>음성을 전사하고, 결정사항과 후속 작업을 근거 문장과 함께 정리합니다.</p></div><button id="login" class="secondary">로그인</button></header>
  <main>
    <section class="capture card"><h2>새 회의</h2><div class="tabs"><button id="recordTab" class="active">녹음</button><button id="fileTab">파일</button></div>
      <div id="recordPanel"><div class="record-row"><button id="record" class="record">● 녹음 시작</button><strong id="timer">00:00</strong></div><p id="recordHint">마이크 권한을 허용하면 브라우저에서 바로 녹음합니다.</p></div>
      <div id="filePanel" hidden><label class="drop">오디오 파일 선택<input id="file" type="file" accept="audio/*"></label></div>
      <div class="fields"><label>언어<select id="language"><option value="auto">자동 감지</option><option value="ko-KR">한국어</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select></label><label>화자 수<input id="speakers" type="number" min="2" max="10" value="4"></label></div>
      <button id="submit" disabled>회의 처리 시작</button><p id="notice" aria-live="polite"></p>
    </section>
    <section class="workspace"><aside class="card"><div class="section-title"><h2>회의 기록</h2><button id="refresh" class="icon">↻</button></div><div id="meetings" class="meeting-list"></div></aside>
      <article id="detail" class="card detail"><div class="empty"><h2>회의를 선택하세요</h2><p>요약, 결정사항, 액션아이템과 전체 전사를 한곳에서 확인할 수 있습니다.</p></div></article></section>
  </main><footer>원본 음성과 전사 결과는 30일 후 자동 삭제하도록 설계되어 있습니다.</footer><script type="module" src="app.js"></script>
</body></html>
